<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Apply the public TV theme before the browser can paint the page.
         ?classic=1 is the only opt-out from the default TV experience. -->
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search)
        const classicLayout = params.get('classic') === '1'
        document.documentElement.classList.toggle('tv-mode', !classicLayout)
        // Test-only marker for the native WebView shell; this runs after the
        // HTML element exists and before the deferred app module executes.
        if (params.get('nativeTest') === '1') {
          document.documentElement.dataset.tvApp = 'true'
        }
      })()
    </script>
    <meta
      name="description"
      content="Blank Box is a blank cable network. Name it, make channels from videos you can play, and watch them on a scheduled retro TV guide."
    />
    <meta name="theme-color" content="#0a0e18" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blank Box" />
    <title>Blank Box · Make your own TV</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
