name: Verify website build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run verify
      - run: npm run build
      - name: Upload desktop and mobile layout screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-layout-screenshots
          path: artifacts/*.png
          if-no-files-found: warn
